                - complementary [ref=f62e233]:
                  - complementary [ref=f62e234]:
                    - generic [ref=f62e235]: ADVERTISEMENT
                - paragraph [ref=f62e238]: Wakil Presiden Gibran Rakabuming Raka menemui Presiden Prabowo Subianto untuk menyampaikan niat mengundurkan diri dari jabatannya sebagai wakil presiden. Pertemuan keduanya berlangsung sekitar dua setengah jam pada Selasa (10/11) pagi.
                - complementary:
                  - generic "viewport impression tracker"
                - complementary [ref=f62e239]:
                  - complementary [ref=f62e240]:
                    - generic [ref=f62e241]: ADVERTISEMENT
                - paragraph [ref=f62e244]: Menteri Sekretaris Negara (Mensesneg) Prasetyo Hadi membenarkan pertemuan tersebut. Ia mengatakan, salah satu hal yang dibahas adalah keinginan Gibran untuk mundur di tengah dinamika terkait keputusan Mahkamah Konstitusi (MK) dan Mahkamah Agung (MA).
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f62e245]: “Dapat kami informasikan kepada seluruh teman-teman media dan seluruh masyarakat bahwa memang benar pagi hari tadi Bapak Wakil presiden ada pertemuan dengan Bapak Presiden pertemuan berlangsung kurang lebih dua setengah jam,” kata Prasetyo di Kompleks Istana Kepresidenan, Jakarta, Selasa (10/11/2026).
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f62e246]: “Di antaranya dalam pembicaraan itu memang bapak wakil presiden bersama tentunya dengan bapak presiden Bapak Prabowo Subianto juga menyatakan pernyataan untuk mengundurkan diri menghadapi dinamika yang berkembang berkaitan dengan keputusan di Mahkamah Konstitusi maupun di Mahkamah Agung,” lanjutnya.
                - complementary:
                  - generic "viewport impression tracker"
                - complementary [ref=f62e247]:
                  - complementary [ref=f62e248]:
                    - generic [ref=f62e249]: ADVERTISEMENT
                - complementary
                - paragraph [ref=f62e252]: Meski demikian, Prasetyo meluruskan kabar yang menyebut Prabowo menolak niat pengunduran diri Gibran. Menurutnya, Presiden tidak menyampaikan penolakan dalam pertemuan tersebut, melainkan memberikan sejumlah saran.
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f62e253]: “Namun sekaligus kami juga ingin meluruskan bahwa tidak benar dalam pertemuan tersebut kalau Bapak Presiden kemudian melakukan atau menyampaikan penolakan niat tersebut,” ujarnya.
                - complementary:
                  - generic "viewport impression tracker"
                - 'figure "Presiden Prabowo Subianto (kanan) didampingi Wakil Presiden Gibran Rakabuming Raka bersiap melantik wakil menteri serta kepala dan wakil kepala badan di Istana Negara, Jakarta, Kamis (15/10/2026). Foto: Hafidz Mubarak A/ANTARA FOTO" [ref=f62e254]'
                - paragraph [ref=f62e256]: Prasetyo menambahkan, Gibran juga meminta kesempatan untuk membuktikan keabsahan dokumen yang dimilikinya melalui proses hukum di peradilan tata usaha.
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f62e257]: “Nah namun dalam diskusi, Bapak Presiden memberikan saran-saran dan Bapak Wakil Presiden Bapak Gibran Rakabuming Raka, dalam pertemuan tersebut juga memohon untuk diberi kesempatan untuk dapat membuktikan keabsahan dokumen yang dimiliki melalui proses di peradilan tata usaha,” ungkapnya.
