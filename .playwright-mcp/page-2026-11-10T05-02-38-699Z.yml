                    - generic [ref=f108e1671]: ADVERTISEMENT
                - paragraph [ref=f108e1674]: Kota Makkah, Arab Saudi, akan menggelar Makkah Marathon 2026 pada 18–19 Desember mendatang. Ajang lari ini menawarkan pengalaman berbeda karena peserta akan melintasi sejumlah kawasan yang selama ini dikenal sebagai bagian penting dari rangkaian ibadah haji, mulai dari Muzdalifah hingga Arafah.
                - complementary:
                  - generic "viewport impression tracker"
                - complementary [ref=f108e1675]:
                  - complementary [ref=f108e1676]:
                    - generic [ref=f108e1677]: ADVERTISEMENT
                - paragraph [ref=f108e1680]:
                  - text: "\"Kegiatan ini menyajikan pengalaman olahraga dan budaya unik yang menggabungkan tantangan atletik dengan penjelajahan situs-situs bersejarah dan keagamaan di kota suci,\" tulis kantor berita Saudi,"
                  - emphasis [ref=f108e1681]: SPA.
                - complementary:
                  - generic "viewport impression tracker"
                - generic [ref=f108e1682]:
                  - heading "Rute dan Kategori Lomba" [level=2] [ref=f108e1683]
                  - paragraph [ref=f108e1684]: Mengutip situs resmi Makkah Marathon, Selasa (10/11), lomba akan mengambil titik awal dan akhir di jalur pejalan kaki Muzdalifah (Muzdalifah Walkway).
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1685]: Muzdalifah Walkway merupakan bagian dari jalur pejalan kaki di kawasan tempat-tempat suci Makkah yang membentang sekitar 25 kilometer, menghubungkan Arafah, Muzdalifah, hingga Mina. Jalur tersebut disebut sebagai jalur pejalan kaki terpanjang di dunia.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1686]: Khusus kategori 21 kilometer, peserta akan berlari menuju Masjid Namirah, kemudian memasuki Jalan Lingkar Arafah (Arafat Ring Road), sebelum kembali melewati Jabal Rahmah dan finis di Muzdalifah.
                  - complementary:
                    - generic "viewport impression tracker"
                  - 'figure "Masjid Namirah di Arafah pada masa puncak haji. Foto: SPA via X/@makkahregion" [ref=f108e1687]'
                  - paragraph [ref=f108e1689]: Sementara itu, kategori 5 kilometer dan 10 kilometer akan berlangsung di kawasan jalur pejalan kaki Muzdalifah.
                  - complementary:
                    - generic "viewport impression tracker"
                  - complementary [ref=f108e1690]:
                    - complementary [ref=f108e1691]:
                      - generic [ref=f108e1692]: ADVERTISEMENT
                  - complementary
                  - paragraph [ref=f108e1695]: Penyelenggara menyediakan lima kategori perlombaan. Pada 18 Desember, akan digelar lomba anak-anak sejauh 2 kilometer untuk usia 4–11 tahun serta lomba adaptif 200 meter bagi penyandang disabilitas motorik.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1696]: Adapun pada 19 Desember, digelar lomba 5 kilometer, 10 kilometer, dan 21 kilometer. Batas usia minimum masing-masing kategori adalah 10 tahun, 14 tahun, dan 16 tahun.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1697]: Situs resmi penyelenggara mencantumkan bahwa pendaftaran kategori lomba diperuntukkan bagi laki-laki, sementara lomba anak-anak terbuka bagi anak laki-laki maupun perempuan.
                  - complementary:
                    - generic "viewport impression tracker"
                  - 'figure "Muzalifah pada masa puncak haji, 2026 Foto: Citro Atmoko/ANTARA FOTO" [ref=f108e1698]'
                  - paragraph [ref=f108e1700]: Rangkaian acara akan diawali dengan pembukaan Makkah Marathon Village pada 17 Desember di kawasan Muzdalifah. Area ini menjadi pusat kegiatan peserta dan pengunjung, termasuk pengambilan perlengkapan lomba, layanan medis, area sponsor, serta berbagai aktivitas olahraga dan hiburan.
                  - complementary:
                    - generic "viewport impression tracker"
                  - complementary [ref=f108e1701]:
                    - complementary [ref=f108e1702]:
                      - generic [ref=f108e1703]: ADVERTISEMENT
                  - paragraph [ref=f108e1706]: Komisi Kerajaan untuk Kota Makkah dan Tempat-Tempat Suci (Royal Commission for Makkah City and Holy Sites) menjadi penyelenggara kegiatan tersebut.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1707]: Maraton ini merupakan bagian dari upaya mempromosikan Makkah sebagai destinasi kegiatan olahraga dan kemasyarakatan sekaligus memperkenalkan warisan sejarah dan budayanya.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f108e1708]: Penyelenggara menyediakan total hadiah sebesar 69.000 riyal (sekitar Rp 331 juta) untuk berbagai kategori perlombaan.
