                  - paragraph [ref=f163e1588]: Rencananya, jenazah Badrul Kamal akan dimakamkan pada Selasa (10/11/2026) hari ini di pemakaman keluarga di kawasan Cikreteg, Ciawi, Kabupaten Bogor.
                  - complementary:
                    - generic "viewport impression tracker"
                  - paragraph [ref=f163e1589]: Badrul Kamal merupakan sosok penting dalam sejarah berdirinya Kota Depok. Sebelum menjadi wali kota definitif, ia menjabat sebagai Wali Kota Administratif Depok periode 1997-1999. Di masa itu, ia menjadi salah satu tokoh yang mengawal proses perubahan status Depok dari kota administratif menjadi kota otonom.
