                - paragraph [ref=f163e1582]: Kabar duka tersebut dikonfirmasi Kepala Dinas Koperasi dan Usaha Mikro (DKUM) Kota Depok, Mohamad Thamrin, saat dihubungi pada Selasa (10/11).
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f163e1583]: "\"Meninggal hari ini jam 19.02 di RS Persahabatan (Jakarta). Jenazah sudah berada di rumah almarhum di Ciawi,\" ujarnya."
                - complementary:
                  - generic "viewport impression tracker"
