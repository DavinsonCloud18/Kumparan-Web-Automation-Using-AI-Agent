                - paragraph [ref=f163e1584]: Thamrin mengungkapkan, almarhum memang telah lama menderita sakit kanker paru-paru.
                - complementary:
                  - generic "viewport impression tracker"
                - paragraph [ref=f163e1585]: Saat dikonfirmasi, Thamrin mengaku sedang berada di rumah duka di kawasan Ciawi, Bogor. Ia menyebut masih sempat menjenguk Badrul Kamal beberapa hari sebelum wafat.
